# Applied after the official dsh-base and dsh-web-app bundles.
- insert:
    - id: futurestaff-core
      name: '@futurestaff/fs-core'
      config:
        tenantId: !!js process.env.FUTURESTAFF_TENANT_ID
        userId: !!js process.env.FUTURESTAFF_USER_ID
        deviceId: !!js process.env.FUTURESTAFF_DEVICE_ID || undefined

    - id: mcp-selection-center
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js >-
        (process.env.PRODUCT_HUB_MCP_URL && process.env.PRODUCT_HUB_AGENT_KEY) ||
        !process.env.SELECTION_CENTER_BASE_URL ||
        !process.env.SELECTION_CENTER_API_KEY
      config:
        serverName: selection-center
        transport: stdio
        command: !!js process.execPath
        args: ['mcp/selection-center/lib/stdio.js']
        cwd: !!js process.cwd()
        env:
          SELECTION_CENTER_BASE_URL: !!js process.env.SELECTION_CENTER_BASE_URL
          SELECTION_CENTER_API_KEY: !!js process.env.SELECTION_CENTER_API_KEY
          SELECTION_CENTER_TIMEOUT_MS: !!js process.env.SELECTION_CENTER_TIMEOUT_MS
          FUTURESTAFF_TENANT_ID: !!js process.env.FUTURESTAFF_TENANT_ID
          FUTURESTAFF_USER_ID: !!js process.env.FUTURESTAFF_USER_ID
        toolCallTimeoutMs: 30000
        failOnStartupError: true

    - id: mcp-product-hub
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js >-
        !process.env.PRODUCT_HUB_MCP_URL ||
        !process.env.PRODUCT_HUB_AGENT_KEY
      config:
        serverName: product-hub
        transport: streamable-http
        url: !!js process.env.PRODUCT_HUB_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.PRODUCT_HUB_AGENT_KEY}`'
        toolCallTimeoutMs: 60000
        failOnStartupError: true
