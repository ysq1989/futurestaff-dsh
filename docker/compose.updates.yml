services:
  updates:
    image: ${DESKTOP_UPDATES_IMAGE:?set an audited immutable nginx image digest or ID}
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:${DESKTOP_UPDATES_PORT:-3178}:8080"
    volumes:
      - "${DESKTOP_UPDATES_PUBLIC_DIR:?set the public artifact directory}:/site:ro"
      - "./nginx/desktop-updates-server.conf:/etc/nginx/nginx.conf:ro"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/stable.json"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
