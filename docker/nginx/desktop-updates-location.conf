# Include in the existing HTTPS server after mounting the public-only release
# directory read-only at /srv/futurestaff-desktop-updates. No private keys/config.
location = /desktop-updates/stable.json {
    alias /srv/futurestaff-desktop-updates/stable.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ ^/desktop-updates/(FutureStaff-Agent-[0-9]+\.[0-9]+\.[0-9]+-x64-Setup\.exe)$ {
    alias /srv/futurestaff-desktop-updates/$1;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "attachment" always;
}

# Only the feed and versioned installers are public. Publication metadata,
# temporary files, operator trust files, and directory browsing are excluded.
location /desktop-updates/ {
    return 404;
}
