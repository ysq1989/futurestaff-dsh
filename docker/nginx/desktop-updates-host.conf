server {
    listen 80;
    server_name fsstory.net;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/java_node_ssl; }
    location / { return 301 https://fsstory.net$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name fsstory.net;
    ssl_certificate /www/server/panel/vhost/cert/fsstory.net/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/fsstory.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/wwwlogs/fsstory.net-updates.log;
    error_log /www/wwwlogs/fsstory.net-updates.error.log;
    location ^~ /desktop-updates/ {
        proxy_pass http://127.0.0.1:3178/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { return 404; }
}
